<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة إمكانية الوصول — تجريبي</title>
    <style>
      body { font-family: Tajawal, system-ui, sans-serif; margin: 0; line-height: 1.7; background: #f8fafc; color: #0f172a; }
      header { background: linear-gradient(135deg,#4f46e5,#0ea5e9); color:#fff; padding: 2.5rem 1.25rem; }
      main { max-width: 820px; margin: 0 auto; padding: 1.5rem; }
      section { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:1.25rem; margin-bottom:1rem; }
      a { color:#2563eb; }
      img { max-width:100%; border-radius:8px; }
    </style>
    <script>
      window.ACCESSIBILITY_WIDGET_CONFIG = {
        language: 'ar',
        position: 'bottom-left',
        enableAnalytics: false
      };
    </script>
  </head>
  <body>
    <header>
      <h1>صفحة تجريبية لإمكانية الوصول</h1>
      <p>اختبر الأدوات والقارئ وملفات التعريف من الزر العائم.</p>
    </header>
    <main>
      <section>
        <h2>نص عربي للتجربة</h2>
        <p>
          إمكانية الوصول الرقمي تجعل المحتوى قابلاً للاستخدام من قبل الجميع، بما فيهم الأشخاص ذوو الإعاقة وكبار السن.
          تعتمد المنصة إرشادات WCAG لتقديم تجربة أوضح وأسهل.
        </p>
        <p><a href="#contact">رابط تجريبي</a> و<strong>نص عريض</strong> و<em>نص مائل</em>.</p>
        <img src="https://placehold.co/600x200/png" alt="صورة تجريبية" />
      </section>
      <section id="contact">
        <h2>نموذج</h2>
        <label>الاسم <input type="text" /></label>
        <button type="button">إرسال</button>
      </section>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
